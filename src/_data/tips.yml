# Losse tips, bij elkaar gesprokkeld uit openbare bronnen: forums, kampblogs,
# verhuurders en het Burning Man Journal. Dit is een groeidocument — voeg toe
# wat je tegenkomt, en zet er altijd bij waar je het vandaan hebt.
#
# `bron` mag leeg blijven voor iets wat je zelf hebt ondervonden; zet dan
# `bron_naam: Eigen ervaring`.

tips:
  # ------------------------------------------------------------------ camper --
  - thema: De camper
    tip: >-
      Plak élk raam van binnen volledig af met radiatorfolie. Niet half, niet
      alleen aan de zonkant: helemaal. Het houdt de ochtendzon buiten én het
      stof, dat anders dwars door "gesloten" ramen naar binnen trekt.
    bron: https://www.trippingly.net/burning-man-rv-tips-protection-and-cleanup
    bron_naam: Trippingly

  - thema: De camper
    tip: >-
      Reken op ongeveer twee rollen folie van 60 cm breed en 7,5 meter lang voor
      een camper van ruim acht meter. Dat is met ruimte over.
    bron: https://eplaya.burningman.org/viewtopic.php?t=78622
    bron_naam: ePlaya

  - thema: De camper
    tip: >-
      Plak ook alle toegangen dicht die je die week toch niet gebruikt. Elke naad
      die open blijft, vind je later terug als een streep stof.
    bron: https://www.trippingly.net/burning-man-rv-tips-protection-and-cleanup
    bron_naam: Trippingly

  - thema: De camper
    tip: >-
      Dek banken en stoelen af met hoeslakens die je vastplakt of -klemt, en
      gebruik zelfhechtende keukenfolie op de lastige stukken. Schelt later bij
      het inleveren.
    bron: https://www.trippingly.net/burning-man-rv-tips-protection-and-cleanup
    bron_naam: Trippingly

  - thema: De camper
    tip: >-
      Fotografeer bij het ophalen alles wat al beschadigd of vuil is. Je wilt bij
      het inleveren geen discussie over stof die er al zat.
    bron_naam: Eigen ervaring

  # ---------------------------------------------------------- kind van vier --
  - thema: Met een kleuter
    tip: >-
      Bij een kind onder de vijf ben je de hele tijd binnen handbereik. Geen
      "even" iets anders doen — je gaat samen, of je gaat niet.
    bron: https://matadornetwork.com/read/parents-guide-kids-burning-man/
    bron_naam: Matador Network

  - thema: Met een kleuter
    tip: >-
      Schrijf je telefoonnummer op de arm van je kind, met erbij wie je bent
      ("papa"). Bandjes raken kwijt, armen niet.
    bron: https://matadornetwork.com/read/parents-guide-kids-burning-man/
    bron_naam: Matador Network

  - thema: Met een kleuter
    tip: >-
      Meld je kind aan bij de organisatie. Vraag bij binnenkomst hoe dat dat jaar
      geregeld is; later kom je er niet meer langs.
    bron: https://survival.burningman.org/kids-and-families/
    bron_naam: Survival Guide

  - thema: Met een kleuter
    tip: >-
      Oefen het stofmasker en de bril weken van tevoren thuis. Een kind dat voor
      het eerst in een stofstorm iets op zijn gezicht krijgt dat het nooit eerder
      droeg, trekt het af.
    bron: https://journal.burningman.org/2016/08/black-rock-city/survive-and-thrive/the-ultimate-guide-to-bringing-your-kids-to-brc-from-parents-whove-done-it-before/
    bron_naam: Burning Man Journal

  - thema: Met een kleuter
    tip: >-
      Gebruik op het gezicht een zonnebrandstick, geen gewone bodylotion. Gewone
      zonnebrand loopt met het zweet in de ogen en brandt — en dan wil je kind er
      de rest van de week niets meer van weten.
    bron: https://journal.burningman.org/2016/08/black-rock-city/survive-and-thrive/the-ultimate-guide-to-bringing-your-kids-to-brc-from-parents-whove-done-it-before/
    bron_naam: Burning Man Journal

  - thema: Met een kleuter
    tip: >-
      Nooit blootsvoets, geen enkele keer. Kindervoetjes zijn extra gevoelig voor
      het basische stof. Wissel vaak van sokken en neem een tweede paar schoenen
      mee.
    bron: https://journal.burningman.org/2016/08/black-rock-city/survive-and-thrive/the-ultimate-guide-to-bringing-your-kids-to-brc-from-parents-whove-done-it-before/
    bron_naam: Burning Man Journal

  - thema: Met een kleuter
    tip: >-
      Neem veel meer sokken mee dan redelijk lijkt. Vijftien paar wordt genoemd,
      en dat is geen grap.
    bron: https://matadornetwork.com/read/parents-guide-kids-burning-man/
    bron_naam: Matador Network

  - thema: Met een kleuter
    tip: >-
      Een opblaasbaar kinderbadje, een campingdouche en een krukje maken het
      dagelijkse wasmoment iets waar je kind naar uitkijkt in plaats van tegenop.
    bron: https://matadornetwork.com/read/parents-guide-kids-burning-man/
    bron_naam: Matador Network

  - thema: Met een kleuter
    tip: >-
      Blijft je kind in het kamp, geef het dan gewoon zijn drinkfles in de hand.
      Een fles die je vasthoudt wordt leeggedronken, een fles in de tas niet.
    bron: https://matadornetwork.com/read/parents-guide-kids-burning-man/
    bron_naam: Matador Network

  # --------------------------------------------------------------- vervoeren --
  - thema: Fietsen en vervoer
    tip: >-
      Tweedehands fietsen koop je in Reno vanaf ongeveer $80 bij het
      Kiwanis-fietsprogramma of vanaf $150 bij Reno Bike Project. Bij beide kun
      je hem na afloop teruggeven; de opbrengst gaat naar fietsprojecten voor
      kinderen in de regio.
    bron: https://playabikerepair.com/products/used-bike-sale
    bron_naam: Playa Bike Repair

  - thema: Fietsen en vervoer
    tip: >-
      Huren kan ook, meestal met een borg van ongeveer $100 per fiets die je
      terugkrijgt bij inleveren.
    bron: https://playabikerepair.com/products/burning-man-bike-rental
    bron_naam: Playa Bike Repair

  - thema: Fietsen en vervoer
    tip: >-
      Smalle, harde wieltjes zakken weg in het stof. Een bolderkar met brede of
      luchtbanden is met een kleuter geen speeltje maar je belangrijkste
      vervoermiddel.
    bron_naam: Eigen ervaring

  # -------------------------------------------------------------------- eten --
  - thema: Eten en drinken
    tip: >-
      Vriesdroogmaaltijden hoeven niet gekoeld en leveren geen afwas op. Een paar
      als reserve achter de hand is goud waard op de dag dat niemand meer zin
      heeft.
    bron: https://blog.outdoorherbivore.com/special-events/eating-on-the-playa-food-options-for-burning-man/
    bron_naam: Outdoor Herbivore

  - thema: Eten en drinken
    tip: >-
      Koop avocado's onrijp. Op de playa rijpen ze veel sneller dan thuis.
    bron: https://blog.outdoorherbivore.com/special-events/eating-on-the-playa-food-options-for-burning-man/
    bron_naam: Outdoor Herbivore

  - thema: Eten en drinken
    tip: >-
      Verse groente is halverwege de week slap. Plan de eerste dagen vers en
      daarna houdbaar, in plaats van te hopen dat het meevalt.
    bron: https://blog.outdoorherbivore.com/special-events/eating-on-the-playa-food-options-for-burning-man/
    bron_naam: Outdoor Herbivore

  - thema: Eten en drinken
    tip: >-
      Vries een portie van je lievelingsafhaalmaaltijd in. Halverwege de week is
      dat een verrassing die meer doet dan je denkt.
    bron: https://blog.outdoorherbivore.com/special-events/eating-on-the-playa-food-options-for-burning-man/
    bron_naam: Outdoor Herbivore

  - thema: Eten en drinken
    tip: >-
      Twee kleine koelboxen werken beter dan één grote: één voor drinken die de
      hele dag opengaat, één voor eten die je bijna dicht kunt laten.
    bron_naam: Eigen ervaring

  # ---------------------------------------------------------------- geld enz --
  - thema: Geld en papieren
    tip: >-
      IJs is een van de weinige dingen die je kunt kopen, en dat gaat contant.
      Reken uit hoeveel je een week nodig hebt en neem dat in kleine biljetten
      mee.
    bron_naam: Eigen ervaring

  - thema: Geld en papieren
    tip: >-
      Reken op een borg van $2.000 tot $5.000 op je creditcard voor de camper,
      los van de huur en de schoonmaaktoeslag. Zorg dat je limiet dat aankan.
    bron: https://campercompare.com.au/blog/burning-man-rv-rental-guide
    bron_naam: CamperCompare

  - thema: Geld en papieren
    tip: >-
      Een kind tot en met twaalf komt gratis binnen, maar heeft wél een eigen
      Kid's Ticket nodig dat je zelf thuis uitprint. Gratis, maar je moet het
      aanvragen — niet iets om bij de poort achter te komen.
    bron: https://survival.burningman.org/kids-and-families/kids-tickets/
    bron_naam: Survival Guide

  # ------------------------------------------------------------------- fiets --
  - thema: Fietsen en vervoer
    tip: >-
      Smeer je fiets níet met olie of WD-40. Olie trekt playastof aan als niets
      anders; de snelste manier om je fiets binnen een dag te laten vastlopen is
      hem vlak voor vertrek royaal in te smeren. Gebruik een droog smeermiddel op
      waxbasis.
    bron: https://journal.burningman.org/2023/07/black-rock-city/survive-and-thrive/reliable-playa-bike-tips/
    bron_naam: Burning Man Journal

  - thema: Fietsen en vervoer
    tip: >-
      Neem een single-speed fiets met dikke banden. Elk bewegend onderdeel is er
      een dat kan vastlopen in het stof — derailleurs en dunne kabels sneuvelen
      als eerste.
    bron: https://survival.burningman.org/getting-around-brc/bicycles/
    bron_naam: Survival Guide

  - thema: Fietsen en vervoer
    tip: >-
      Wil je de fiets houden: eerst afspuiten, dan schrobben met half azijn en
      half water. De azijn neutraliseert het alkali dat anders je onderdelen
      aantast. Goed laten drogen, en pás daarna smeren.
    bron: https://journal.burningman.org/2023/07/black-rock-city/survive-and-thrive/reliable-playa-bike-tips/
    bron_naam: Burning Man Journal

  - thema: Fietsen en vervoer
    tip: >-
      Voor alles wat je achter je aan trekt: minimaal 15 cm luchtband, liever 25
      cm of een echte mountainbikeband. Harde plastic wieltjes zakken weg.
    bron: https://eplaya.burningman.org/viewtopic.php?t=8813
    bron_naam: ePlaya

  # ------------------------------------------------------------- stof en huid --
  - thema: Stof, huid en kleding
    tip: >-
      Playa foot is letterlijk een chemische brandwond. Het stof droogt je huid
      uit, de huid scheurt, en in die scheurtjes komt het alkali. De belangrijkste
      oorzaak is simpel: blote voeten of open schoenen op de woestijnbodem.
    bron: https://burningman.org/black-rock-city/preparation/health-safety/playa-foot/
    bron_naam: Burning Man Project

  - thema: Stof, huid en kleding
    tip: >-
      Was 's avonds je voeten in één deel azijn op drie delen water. Dat
      neutraliseert het alkali. Daarna dik insmeren met een vette crème.
    bron: https://burningman.org/black-rock-city/preparation/health-safety/playa-foot/
    bron_naam: Burning Man Project

  - thema: Stof, huid en kleding
    tip: >-
      Merinowol is de meest genoemde keuze voor sokken, omdat wol ademt. Het
      alternatief werkt ook: een pak van twintig goedkope katoenen sokken, elke
      dag een schoon paar, aan het eind weggooien.
    bron: https://eplaya.burningman.org/viewtopic.php?t=108295
    bron_naam: ePlaya

  - thema: Stof, huid en kleding
    tip: >-
      Stevige laarzen, geen sneakers. Playastof vreet schoenen met mesh erin.
    bron: https://www.survivingburningman.com/2018/07/11/day-clothes-vs-night-clothes/
    bron_naam: Surviving Burning Man

  - thema: Stof, huid en kleding
    tip: >-
      Wat eerstekeergangers het vaakst onderschatten is de kou 's nachts — naar
      een graad of vier en soms lager. Houd één tas apart met alleen warme
      kleren, want als de zon ondergaat gaat het snel.
    bron: https://www.survivingburningman.com/2018/07/11/day-clothes-vs-night-clothes/
    bron_naam: Surviving Burning Man

  - thema: Stof, huid en kleding
    tip: >-
      Het masker werkt alleen samen met een afsluitende bril van het ski- of
      motorcrosstype. Een masker zonder bril laat je ogen onbeschermd, een bril
      zonder masker laat je ademen in stof.
    bron: https://frogmask.eu/en-eu/blogs/news/which-dust-mask-for-burning-man
    bron_naam: Frogmask

  # ---------------------------------------------------------------- het kamp --
  - thema: Het kamp
    tip: >-
      Gewone tentharingen komen er niet in of trekken er zo weer uit. Gebruik
      betonijzer: ongeveer 35 cm de grond in, 20 tot 25 cm eruit, onder een hoek
      ingeslagen en zo'n 60 cm buiten de rand van je constructie.
    bron: https://burningman.org/black-rock-city/preparation/camping-tips/securing-your-structure/
    bron_naam: Burning Man Project

  - thema: Het kamp
    tip: >-
      EL-draad werkt op wisselspanning, dus er zit altijd een batterijpakje met
      omvormer aan — en dat zoemt hoorbaar. Stop het in je broekzak. Overdag zie
      je er bovendien niets van.
    bron: https://learn.sparkfun.com/tutorials/getting-started-with-electroluminescent-el-wire/all
    bron_naam: SparkFun

  - thema: Eten en drinken
    tip: >-
      De officiële norm is 1,5 gallon water per persoon per dag — ongeveer 5,7
      liter — voor drinken, koken en basaal wassen. Veel mensen nemen meer.
      Gebruik alleen containers waar eerder uitsluitend drinkwater in zat.
    bron: https://burningman.org/black-rock-city/preparation/camping-tips/water/
    bron_naam: Burning Man Project
